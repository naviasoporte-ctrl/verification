<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />

  <title>Email verificado — navIA</title>
  <meta name="description" content="Tu dirección de correo electrónico de navIA se ha verificado correctamente." />
  <meta name="theme-color" content="#061523" />
  <meta name="robots" content="noindex,nofollow,noarchive" />

  <link rel="icon" href="./icon.png" />

  <style>
    :root{
      --navy:#061523;
      --cyan:#67e8f9;
      --text:#0b1f2d;
      --muted:#637987;
      --line:rgba(10,42,62,.11);
      --soft:#f4f8fb;
      --shadow:0 34px 90px rgba(0,0,0,.28);
      --max:1120px;
    }

    *{box-sizing:border-box}

    html,body{
      margin:0;
      min-height:100%;
    }

    body{
      min-height:100vh;
      color:#fff;
      background:
        radial-gradient(circle at 82% 18%,rgba(56,189,248,.28),transparent 29%),
        radial-gradient(circle at 10% 82%,rgba(45,212,191,.14),transparent 27%),
        linear-gradient(145deg,#04111c 0%,#082436 58%,#0b3b4c 100%);
      font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
      -webkit-font-smoothing:antialiased;
      overflow-x:hidden;
    }

    a{color:inherit}

    .page{
      position:relative;
      min-height:100vh;
      display:flex;
      flex-direction:column;
      overflow:hidden;
    }

    .page::before{
      content:"";
      position:absolute;
      right:-220px;
      bottom:-250px;
      width:560px;
      height:560px;
      border-radius:50%;
      border:1px solid rgba(255,255,255,.07);
    }

    .page::after{
      content:"";
      position:absolute;
      left:-150px;
      top:130px;
      width:320px;
      height:320px;
      border-radius:50%;
      background:rgba(103,232,249,.035);
    }

    .wave-lines{
      position:absolute;
      z-index:0;
      inset:auto 0 0;
      height:160px;
      opacity:.23;
      pointer-events:none;
      background:
        radial-gradient(70% 100% at 50% 100%,transparent 55%,rgba(255,255,255,.14) 56%,transparent 57%) 0 8px/320px 110px repeat-x,
        radial-gradient(70% 100% at 50% 100%,transparent 55%,rgba(255,255,255,.08) 56%,transparent 57%) 90px 34px/360px 125px repeat-x;
      animation:drift 18s linear infinite;
    }

    @keyframes drift{
      from{background-position-x:0,90px}
      to{background-position-x:320px,450px}
    }

    .header{
      position:relative;
      z-index:3;
      width:min(var(--max),calc(100% - 40px));
      min-height:76px;
      margin:0 auto;
      display:flex;
      align-items:center;
      justify-content:space-between;
    }

    .brand{
      display:inline-flex;
      align-items:center;
      gap:11px;
      color:#fff;
      text-decoration:none;
      font-size:1.08rem;
      font-weight:900;
      letter-spacing:-.03em;
    }

    .brand img{
      width:38px;
      height:38px;
      border-radius:12px;
      box-shadow:0 8px 24px rgba(0,0,0,.18);
    }

    .support-link{
      display:inline-flex;
      align-items:center;
      min-height:40px;
      padding:0 15px;
      border:1px solid rgba(255,255,255,.14);
      border-radius:999px;
      color:rgba(255,255,255,.82);
      background:rgba(255,255,255,.06);
      text-decoration:none;
      font-size:.88rem;
      font-weight:750;
      backdrop-filter:blur(10px);
    }

    .main{
      position:relative;
      z-index:2;
      flex:1;
      width:min(560px,calc(100% - 40px));
      margin:0 auto;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:56px 0 84px;
    }

    .card{
      width:100%;
      padding:36px 32px 32px;
      border:1px solid rgba(255,255,255,.5);
      border-radius:30px;
      color:var(--text);
      background:rgba(255,255,255,.97);
      box-shadow:var(--shadow);
      backdrop-filter:blur(20px);
      text-align:center;
    }

    .success-mark{
      display:grid;
      place-items:center;
      width:76px;
      height:76px;
      margin:0 auto 22px;
      border-radius:50%;
      color:#12815e;
      background:#eafbf5;
      font-size:2rem;
      font-weight:900;
      box-shadow:0 12px 28px rgba(18,129,94,.10);
    }

    .eyebrow{
      display:inline-flex;
      align-items:center;
      gap:8px;
      margin-bottom:13px;
      padding:7px 11px;
      border-radius:999px;
      color:#087da5;
      background:#eaf8fc;
      font-size:.77rem;
      font-weight:850;
      text-transform:uppercase;
      letter-spacing:.09em;
    }

    h1{
      margin:0 0 12px;
      font-size:clamp(2rem,5vw,2.8rem);
      line-height:1.05;
      letter-spacing:-.05em;
    }

    .lead{
      margin:0 auto;
      max-width:430px;
      color:var(--muted);
      font-size:.98rem;
      line-height:1.65;
    }

    .actions{
      display:flex;
      flex-wrap:wrap;
      justify-content:center;
      gap:10px;
      margin-top:26px;
    }

    .btn{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      min-height:48px;
      padding:0 18px;
      border-radius:999px;
      text-decoration:none;
      font-size:.89rem;
      font-weight:850;
      transition:.2s ease;
    }

    .btn.primary{
      color:#fff;
      background:linear-gradient(135deg,#087da5,#0aaac4);
      box-shadow:0 12px 28px rgba(8,125,165,.22);
    }

    .btn.secondary{
      color:var(--text);
      border:1px solid var(--line);
      background:#fff;
    }

    .btn:hover{transform:translateY(-2px)}

    .small{
      margin-top:22px;
      color:#81929c;
      font-size:.79rem;
      line-height:1.5;
    }

    .footer{
      position:relative;
      z-index:3;
      width:min(var(--max),calc(100% - 40px));
      margin:0 auto;
      display:flex;
      justify-content:space-between;
      gap:18px;
      padding:22px 0 28px;
      border-top:1px solid rgba(255,255,255,.08);
      color:rgba(255,255,255,.47);
      font-size:.78rem;
    }

    .footer-links{
      display:flex;
      flex-wrap:wrap;
      gap:18px;
    }

    .footer a{
      color:rgba(255,255,255,.62);
      text-decoration:none;
    }

    @media(max-width:600px){
      .header,.main,.footer{
        width:min(100% - 28px,var(--max));
      }

      .header{min-height:68px}
      .support-link{font-size:.8rem;padding:0 12px}
      .main{padding:36px 0 58px}

      .card{
        padding:30px 22px 26px;
        border-radius:25px;
      }

      .actions{flex-direction:column}
      .btn{width:100%}

      .footer{
        flex-direction:column;
        align-items:center;
        text-align:center;
      }

      .footer-links{justify-content:center}
    }

    @media(prefers-reduced-motion:reduce){
      *,*::before,*::after{
        animation-duration:.001ms!important;
        animation-iteration-count:1!important;
        transition-duration:.001ms!important;
      }
    }
  </style>
</head>

<body>
  <div class="page">
    <div class="wave-lines"></div>

    <header class="header">
      <a class="brand" href="https://naviasoporte-ctrl.github.io/web/#top" aria-label="navIA">
        <img src="./icon.png" alt="Logo de navIA" />
        <span>navIA</span>
      </a>

      <a class="support-link" href="https://naviasoporte-ctrl.github.io/support/">
        ¿Necesitas ayuda?
      </a>
    </header>

    <main class="main">
      <section class="card">
        <div class="success-mark">✓</div>

        <div class="eyebrow">Cuenta verificada</div>

        <h1>¡Email verificado!</h1>

        <p class="lead">
          Tu dirección de correo se ha verificado correctamente.
          Ya puedes volver a navIA e iniciar sesión con tu cuenta.
        </p>

        <div class="actions">
          <a class="btn primary" href="https://naviasoporte-ctrl.github.io/web/#top">
            Volver a navIA →
          </a>

          <a class="btn secondary" href="https://naviasoporte-ctrl.github.io/support/">
            Abrir soporte
          </a>
        </div>

        <div class="small">
          Puedes cerrar esta ventana con seguridad.
        </div>
      </section>
    </main>

    <footer class="footer">
      <span>© <span id="year"></span> navIA</span>

      <div class="footer-links">
        <a href="https://naviasoporte-ctrl.github.io/privacy/">Privacidad</a>
        <a href="https://naviasoporte-ctrl.github.io/support/">Soporte</a>
      </div>
    </footer>
  </div>

  <script>
    document.getElementById("year").textContent = new Date().getFullYear();
  </script>
</body>
</html>
